# Aphrody Labs — Central Fleet Bill of Materials (BOM)
# Single Source of Truth for toolchains, versioning policy, shared Rust crates,
# shared Bun/npm catalog packages, and SHA-pinned GitHub Actions across all repos.
#
# Reconcile / verify with:
#   bun scripts/fleet-bom.ts audit
#   bun scripts/fleet-bom.ts sync --dry-run
#   bun scripts/fleet-bom.ts check

[meta]
schema_version = 1
organization = "aphrody-labs"
hub_repo = "aphrody-labs/aphrody-kit"
hub_ref = "main"

[toolchains]
bun = "1.4.6"
rust_nightly = "nightly-2026-11-14"
rust_stable = "1.100.0"
rust_edition = "2024"
rust_version = "1.100"
typescript = "7.0.2"

# Per-repository standardization policy (versioning scheme, Rust channel, CI runner).
[repos.aphrody]
version_scheme = "calver"
rust_channel = "nightly"
runner = "cluster"
sibling_repo = "aphrody-labs/ay"

[repos.aphrody-kit]
version_scheme = "semver"
rust_channel = "nightly"
runner = "ubuntu-latest"

[repos.ay]
version_scheme = "calver"
rust_channel = "nightly"
runner = "cluster"

[repos.nie]
version_scheme = "semver"
rust_channel = "stable"
runner = "ubuntu-latest"

[repos.shenron]
version_scheme = "semver"
rust_channel = "stable"
runner = "ubuntu-latest"

# Canonical shared Rust crates across [workspace.dependencies].
# All drift (patch, minor, major, and pinned `=X.Y.Z`) fails `fleet-bom.ts check`
# by default; `sync --apply` reconciles safe patch/minor updates automatically.
[crates]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
