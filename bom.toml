# Canonical shared Bun/npm catalog packages across workspaces.catalog.
[packages]
"@ast-grep/napi" = "0.51.3"
"@types/node" = "26.6.6"
"@types/react" = "19.3.3"
"@types/react-dom" = "19.3.0"
ai = "7.0.183"
react = "19.3.1"
react-dom = "19.3.1"
typescript = "7.0.2"
undici-types = "8.3.0"
zod = "4.6.7"

