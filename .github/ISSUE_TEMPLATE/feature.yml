name: Feature request
description: Propose a capability or behavior change
title: "feat: "
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: What you cannot do today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose
      description: The behavior you want. An API sketch or example is welcome. Say whether a CLI flag, an API or both is affected.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, upstream features or workarounds that almost fit, and why they do not.
  - type: dropdown
    id: contribute
    attributes:
      label: Can you help build it?
      options:
        - "Yes, I will send a pull request"
        - "Yes, with guidance"
        - "No"
    validations:
      required: true
