name: Bug report
description: Something does not work as documented
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first and try the latest release; the bug may be fixed. For a vulnerability use the Security tab, not this form. For usage questions see SUPPORT.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal, copy-pasteable reproduction (a repository, a snippet, a command). Text, not screenshots.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you thought would happen, and where the documentation says so.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you see instead
      description: Output, logs or a stack trace as text. Remove secrets and tokens before pasting.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The tool's version command, a release tag, or `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: "`uname -mprs` on Linux and macOS; the Windows version and architecture on Windows."
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - Web / browser
        - Other
  - type: textarea
    id: more
    attributes:
      label: Additional information
      description: Anything else a maintainer should know (workarounds, when it started, related issues).
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched open and closed issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
