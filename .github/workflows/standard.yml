name: standard

# Lints the standard itself: standard.toml, ruleset JSON, workflow pinning and permissions, issue forms, starter workflows.
on:
  push:
    branches: [main]
    paths:
      - "standard.toml"
      - "STANDARD.md"
      - "tools/**"
      - "profile/generate.ts"
      - ".github/**"
      - "workflow-templates/**"
      - "templates/**"
      - "docs/standards/**"
      - "CONTRIBUTING.md"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun tools/lint-standard.ts
      - run: bun tools/standards-sources.ts check
      - run: bun tools/lint-code-style.ts
      - run: bun test tools
      - run: bun build profile/generate.ts --target=bun --outdir "$RUNNER_TEMP/gen"

  docs:
    uses: ./.github/workflows/docs.yml
    with:
      mdx-dir: ""
      check-links: false
    permissions:
      contents: read
