name: pages

# Reusable GitHub Pages deploy through Actions (Settings, Pages, Source: GitHub Actions). Never a gh-pages branch.
# The caller grants: contents: read, pages: write, id-token: write.
on:
  workflow_call:
    inputs:
      build-command:
        type: string
        default: bun run build
      output-dir:
        type: string
        default: dist
      working-directory:
        type: string
        default: .
      bun-version:
        type: string
        default: latest

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: bun install --frozen-lockfile
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -c "$BUILD_COMMAND"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.output-dir }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
