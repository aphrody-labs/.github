name: Reusable Release (crates.io + npm + GitHub Packages + PyPI + GHCR OCI + R2 CDN + GitHub Release)

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        default: "nightly-2026-11-14"
      run_xtask:
        description: "Run cargo xtask release & R2 registry generation (aphrody-kit)"
        type: boolean
        default: true
      build_cmd:
        description: "Custom artifact build command when run_xtask is false"
        type: string
        default: ""
      publish_crates:
        type: boolean
        default: true
      publish_npm:
        type: boolean
        default: true
      publish_pypi:
        type: boolean
        default: true
      publish_r2:
        type: boolean
        default: true
      crates_exclude:
        description: "Workspace crate to exclude from publish (e.g. xtask)"
        type: string
        default: "xtask"
      npm_packages:
        description: "Space-separated workspace package directories to publish"
        type: string
        default: "packages/abi"
      abi_crate:
        description: "Optional cdylib crate to attach prebuilt native/wasm artifacts"
        type: string
        default: "aphrody-abi"
      wasm_crate:
        description: "Optional wasm32 crate to attach prebuilt .wasm artifact"
        type: string
        default: ""
      oci_images:
        description: "Space-separated name=dockerfile pairs to publish to ghcr.io/<owner>/<name>"
        type: string
        default: ""
      auto_tag:
        description: "Create and push v<version> tag when triggered outside a tag ref and dry_run is false"
        type: boolean
        default: false
      release_tag:
        description: "Explicit tag override (e.g. v1.2.3) when auto_tag is true"
        type: string
        default: ""
      release_files:
        description: "Newline-separated asset globs uploaded to GitHub Release"
        type: string
        default: |
          dist/prebuilt/libaphrody_abi.so
          dist/prebuilt/aphrody_abi.h
          dist/prebuilt/SHA256SUMS.txt
          dist/packages/*.tgz
          dist/packages/SHA256SUMS.txt
          dist/SHA256SUMS.txt
      r2_releases_bucket:
        description: "Cloudflare R2 bucket for releases.aphrody.com"
        type: string
        default: "aphrody-releases"
      r2_dist_bucket:
        description: "Cloudflare R2 bucket for cdn.aphrody.com/npm"
        type: string
        default: "aphrody-dist"
      dry_run:
        type: boolean
        default: false
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      PYPI_TOKEN:
        required: false
      UV_PUBLISH_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  prepare-tag:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: canary
      - name: Resolve or create release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPLICIT_TAG: ${{ inputs.release_tag }}
          AUTO_TAG: ${{ inputs.auto_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref }}
        run: |
          tag=""
          if [[ "$REF_TYPE" == refs/tags/v* ]]; then
            tag="$REF_NAME"
          elif [ -n "$EXPLICIT_TAG" ]; then
            tag="$EXPLICIT_TAG"
          else
            ver="$(bun -e '
              import { existsSync, readFileSync } from "node:fs";
              if (existsSync("package.json")) {
                const p = JSON.parse(readFileSync("package.json", "utf8"));
                if (p.version) { console.log(p.version); process.exit(0); }
              }
              if (existsSync("Cargo.toml")) {
                const c = readFileSync("Cargo.toml", "utf8");
                const m = c.match(/^version\s*=\s*"([^"]+)"/m);
                if (m) { console.log(m[1]); process.exit(0); }
              }
              console.log("0.0.0");
            ')"
            tag="v${ver#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" != refs/tags/* ]] && [ "$AUTO_TAG" = "true" ] && [ "$DRY_RUN" != "true" ] && [ "$tag" != "v0.0.0" ]; then
            if ! git rev-parse "$tag" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" -m "release: $tag"
              git push origin "refs/tags/$tag"
            fi
          fi

  build-artifacts:
    name: Build & Verify Release Artifacts
    runs-on: ubuntu-latest
    needs: prepare-tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        if: ${{ inputs.run_xtask || inputs.publish_crates || inputs.wasm_crate != '' }}
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ hashFiles('.bun-version') != '' }}
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ hashFiles('.bun-version') == '' }}
        with:
          bun-version: canary
      - if: ${{ inputs.run_xtask || inputs.publish_crates }}
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - if: ${{ hashFiles('package.json') != '' }}
        run: bun install --frozen-lockfile || bun install
      - name: Build release artifacts & checksums
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C target-cpu=x86-64-v3 -C link-arg=-Wl,--gc-sections -C link-arg=-Wl,--icf=safe -C link-arg=-Wl,-z,pack-relative-relocs -C link-arg=-Wl,-z,relro,-z,now"
          CUSTOM_BUILD_CMD: ${{ inputs.build_cmd }}
        run: |
          mkdir -p dist
          if [ "${{ inputs.run_xtask }}" = "true" ]; then
            cargo xtask hygiene
            cargo xtask abi-check
            if [ -n "${{ inputs.abi_crate }}" ]; then
              cargo xtask build-release
            fi
            if [ -n "${{ inputs.wasm_crate }}" ]; then
              RUSTFLAGS="-C target-feature=+simd128,+bulk-memory" cargo build -p "${{ inputs.wasm_crate }}" --target wasm32-unknown-unknown --release
              mkdir -p dist/prebuilt
              cp target/wasm32-unknown-unknown/release/*.wasm dist/prebuilt/ 2>/dev/null || true
            fi
            bun scripts/export-consumers.ts
            bun scripts/generate-r2-registry.ts
          elif [ -n "$CUSTOM_BUILD_CMD" ]; then
            bash -euo pipefail -c "$CUSTOM_BUILD_CMD"
          fi
          if [ -n "${{ inputs.npm_packages }}" ]; then
            mkdir -p dist/packages
            for pkg in ${{ inputs.npm_packages }}; do
              if [ -d "$pkg" ]; then
                bun pm pack --cwd "$pkg" --destination dist/packages || true
              fi
            done
          fi
          find dist -maxdepth 3 -type f ! -name 'SHA256SUMS.txt' | sort | xargs -r sha256sum > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/

  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: ${{ inputs.publish_crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Package or publish Rust workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "No Cargo.toml found; skipping crates.io."
            exit 0
          fi
          exclude_flag=""
          if [ -n "${{ inputs.crates_exclude }}" ]; then
            exclude_flag="--exclude ${{ inputs.crates_exclude }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "crates.io: running dry-run package check (dry_run=${{ inputs.dry_run }})"
            cargo package --workspace $exclude_flag --no-verify
          else
            cargo publish --workspace $exclude_flag
          fi

  publish-github-packages:
    name: Publish GitHub Packages (npm.pkg.github.com)
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: ${{ inputs.publish_npm && inputs.npm_packages != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ hashFiles('.bun-version') != '' }}
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ hashFiles('.bun-version') == '' }}
        with:
          bun-version: canary
      - name: Publish packages to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in ${{ inputs.npm_packages }}; do
            if [ ! -d "$pkg" ]; then
              echo "::warning::Package path missing: $pkg"
              continue
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              bun pm pack --cwd "$pkg" --dry-run
            else
              bun publish --cwd "$pkg" --registry https://npm.pkg.github.com/ || echo "::warning::Skipped or already published: $pkg"
            fi
          done

  publish-npm:
    name: Publish npmjs.org
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: ${{ inputs.publish_npm && inputs.npm_packages != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ hashFiles('.bun-version') != '' }}
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ hashFiles('.bun-version') == '' }}
        with:
          bun-version: canary
      - name: Publish packages to npmjs.org
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "npmjs.org: running dry-run pack check (dry_run=${{ inputs.dry_run }})"
            for pkg in ${{ inputs.npm_packages }}; do
              if [ -d "$pkg" ]; then
                bun pm pack --cwd "$pkg" --dry-run
              fi
            done
          else
            for pkg in ${{ inputs.npm_packages }}; do
              if [ -d "$pkg" ]; then
                bun publish --cwd "$pkg" --access public --provenance --registry https://registry.npmjs.org/ || echo "::warning::Skipped or already published: $pkg"
              fi
            done
          fi

  publish-pypi:
    name: Publish PyPI
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: ${{ inputs.publish_pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Build and optionally publish Python wheel/sdist
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN || secrets.PYPI_TOKEN }}
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "No pyproject.toml found; skipping PyPI."
            exit 0
          fi
          uv build
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "PyPI: built wheel/sdist in dry-run mode"
            ls -lh dist/
          else
            uv publish --token "$UV_PUBLISH_TOKEN" || echo "::warning::PyPI publish skipped or version exists"
          fi

  publish-oci:
    name: Publish GHCR OCI Containers
    runs-on: ubuntu-latest
    needs: [prepare-tag, build-artifacts]
    if: ${{ inputs.oci_images != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push GHCR images
        env:
          OCI_IMAGES: ${{ inputs.oci_images }}
          RELEASE_TAG: ${{ needs.prepare-tag.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          for spec in $OCI_IMAGES; do
            name="${spec%%=*}"
            dockerfile="${spec#*=}"
            if [ ! -f "$dockerfile" ]; then
              echo "::warning::Dockerfile not found: $dockerfile"
              continue
            fi
            image="ghcr.io/${owner_lc}/${name}"
            if [ "$DRY_RUN" = "true" ]; then
              docker buildx build --file "$dockerfile" --tag "${image}:${RELEASE_TAG}" .
            else
              docker buildx build \
                --file "$dockerfile" \
                --tag "${image}:${RELEASE_TAG}" \
                --tag "${image}:sha-${SHA::7}" \
                --tag "${image}:latest" \
                --push \
                .
            fi
          done

  publish-r2-cdn:
    name: Publish Cloudflare R2 (cdn & releases.aphrody.com)
    runs-on: ubuntu-latest
    needs: [prepare-tag, build-artifacts]
    if: ${{ inputs.publish_r2 && inputs.dry_run == false && (startsWith(github.ref, 'refs/tags/v') || inputs.auto_tag) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ hashFiles('.bun-version') != '' }}
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ hashFiles('.bun-version') == '' }}
        with:
          bun-version: canary
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - name: Upload immutable release & npm packuments to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ ! -f scripts/upload-r2.ts ]; then
            echo "::notice::R2 credentials or scripts/upload-r2.ts absent — skipping R2 upload"
            exit 0
          fi
          bun scripts/upload-r2.ts --releases-bucket "${{ inputs.r2_releases_bucket }}" --dist-bucket "${{ inputs.r2_dist_bucket }}"

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-tag, build-artifacts]
    if: ${{ inputs.dry_run == false && (startsWith(github.ref, 'refs/tags/v') || inputs.auto_tag) && needs.prepare-tag.outputs.tag != 'v0.0.0' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ github.event.repository.visibility == 'public' }}
        with:
          subject-path: "dist/**/*"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.prepare-tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: ${{ inputs.release_files }}
