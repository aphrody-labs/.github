name: ci-bun

# Reusable CI for Bun / TypeScript repositories. Caller job id must be "ci" so the required check is "ci / gate".
on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version to install (a version, "latest" or "canary")
        type: string
        default: latest
      working-directory:
        type: string
        default: .
      runs-on:
        description: Runner label as a JSON array
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bun run --if-present lint
      - run: bun run --if-present typecheck
      - run: bun test
      - run: bun run --if-present build

  gate:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.check.result }}" = success
