name: ci-rust

# Reusable CI for Rust repositories (Cargo workspaces). Caller job id must be "ci".
on:
  workflow_call:
    inputs:
      toolchain:
        description: Rust toolchain (stable, nightly, or a version)
        type: string
        default: stable
      working-directory:
        type: string
        default: .
      os:
        description: Runner labels as a JSON array
        type: string
        default: '["ubuntu-latest"]'
      features:
        description: Cargo feature flags, for example "--all-features" or "--no-default-features"
        type: string
        default: --all-features

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.working-directory }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked ${{ inputs.features }} -- -D warnings
      - run: cargo test --workspace --locked ${{ inputs.features }}

  gate:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.check.result }}" = success
