name: readme

# Regenerates profile/README.md from the live repository lists with profile/generate.ts (roles and families: standard.toml).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun profile/generate.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          if git diff --cached --quiet; then echo "up to date"; else git commit -m "docs(profile): regenerate from the GitHub API" && git push; fi
