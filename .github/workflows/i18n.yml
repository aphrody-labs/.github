name: i18n

# Tests the checker, then checks this repository with it.
on:
  push:
    branches: [main]
    paths: ["i18n/**", ".editorconfig", ".gitattributes", ".github/workflows/i18n.yml"]
  pull_request:
    paths: ["i18n/**", ".editorconfig", ".gitattributes", ".github/workflows/i18n.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun test i18n
      - run: bun i18n/check.ts .
